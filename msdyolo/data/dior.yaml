# DIOR Dataset Configuration for Object Detection
# Dataset: DIOR (Dataset for Object Detection in Aerial Images)
# Paper: https://arxiv.org/abs/1909.00133
# Classes: 20 categories

path: dataset/DIOR
train: train/images
val: val/images
test: test/images  # Optional

# Classes (20 categories - match DIOR-R dataset exactly)
nc: 20
names: [
  'airplane',
  'airport',
  'baseballfield',
  'basketballcourt',
  'bridge',
  'chimney',
  'dam',
  'Expressway-Service-area',
  'Expressway-toll-station',
  'golffield',
  'groundtrackfield',
  'harbor',
  'overpass',
  'ship',
  'stadium',
  'storagetank',
  'tenniscourt',
  'trainstation',
  'vehicle',
  'windmill'
]

# Dataset Info
dataset: DIOR
version: v1.0
description: Dataset for Object Detection in Aerial Images (800x800 resolution)
num_images: 23463
image_size: 800
format: horizontal_bbox  # DIOR使用水平框，不是旋转框
