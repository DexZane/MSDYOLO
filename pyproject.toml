[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msdyolo"
version = "1.0.0"
description = "Multi-Scale Deformable YOLO for Oriented Object Detection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "MSDYOLO Team"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]
dependencies = [
  "matplotlib>=3.2.2",
  "numpy>=1.18.5",
  "Shapely>=2.0",
  "opencv-python>=4.5.4",
  "Pillow>=7.1.2",
  "PyYAML>=5.3.1",
  "requests>=2.23.0",
  "scipy>=1.4.1",
  "torch>=1.7.0",
  "torchvision>=0.8.1",
  "tqdm>=4.41.0",
  "tensorboard>=2.4.1",
  "pandas>=1.1.4",
  "seaborn>=0.11.0",
  "thop",
]

[project.scripts]
msdyolo-train = "msdyolo.train:main"
msdyolo-val = "msdyolo.val:cli"
msdyolo-detect = "msdyolo.detect:cli"
msdyolo-export = "msdyolo.export:cli"

# Package data and the legacy setup.py entry point remain in place for the
# project's existing wheel checks and for backwards-compatible installation.
