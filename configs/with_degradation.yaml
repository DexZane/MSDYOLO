experiment:
  name: with_degradation
  description: Original YOLOv5-OBB baseline
  phase: 1
training:
  data: data/dotav15_poly.yaml
  cfg: models/yolov5s.yaml
  weights: ''
  epochs: 300
  batch_size: 16
  img_size: 1024
  device: '0'
  workers: 8
  hyp: data/hyps/hyp.scratch.yaml
degradation:
  enabled: true
  psf:
    enabled: true
    kernel_size: 5
    sigma: 1.0
  downsample:
    enabled: true
    scale: 2.0
  noise:
    enabled: false
    type: gaussian
    level: 0.01
  upsample_mode: bilinear
  seed: 42
clear_branch:
  enabled: false
  strategy: eval_mode
  extract_sparse: true
  top_k: 300
  conf_threshold: 0.25
distillation:
  enabled: false
  alpha: 0.1
  match_iou_threshold: 0.5
  loss_type: l1
  angle_weight: null
  detectability_weight: null
profiling:
  enabled: true
  log_interval: 100
  save_stats: true
  output_dir: runs/profiling
ablation_mode: with_degradation
