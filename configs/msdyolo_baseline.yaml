experiment:
  name: baseline
  description: Original YOLOv5-OBB baseline
  phase: 1
training:
  data: data/dota_test.yaml  # 使用测试数据集
  cfg: models/yolov5s.yaml
  weights: ''
  epochs: 300
  batch_size: 2  # 低显存配置
  img_size: 1024
  device: '0'
  workers: 0  # 设为0避免多进程问题
  hyp: data/hyps/obb/hyp.finetune_dota.yaml
degradation:
  enabled: false
  psf:
    enabled: false
    kernel_size: 5
    sigma: 1.0
  downsample:
    enabled: false
    scale: 2.0
  noise:
    enabled: false
    type: gaussian
    level: 0.01
  upsample_mode: bilinear
  seed: 42
clear_branch:
  enabled: false
  strategy: eval_mode
  extract_sparse: true
  top_k: 300
  conf_threshold: 0.25
distillation:
  enabled: false
  alpha: 0.1
  match_iou_threshold: 0.5
  loss_type: l1
  angle_weight: null
  detectability_weight: null
profiling:
  enabled: false
  log_interval: 100
  save_stats: true
  output_dir: runs/profiling
ablation_mode: baseline
