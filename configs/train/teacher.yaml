experiment:
  name: dota_teacher
  description: Clean DOTA v1.5 baseline used as the frozen full-MSD teacher
  phase: 1
training:
  data: msdyolo/data/dota.yaml
  cfg: configs/models/yolov5s.yaml
  weights: yolov5s.pt
  epochs: 200
  batchsize: 16
  imagesize: 1024
  device: '0'
  workers: 4
  hyp: msdyolo/data/hyps/obb/hyp.finetune_dota.yaml
degradation:
  enabled: false
clearbranch:
  enabled: false
distillation:
  enabled: false
profiling:
  enabled: false
ablationmode: baseline
