# MSDYOLO Full 配置：完整蒸馏系统
# 包含退化、清晰分支和四分量蒸馏

experiment:
  name: "msdyolo-full"
  description: "Full MSDYOLO with degradation, clear branch, and distillation"
  phase: 2

training:
  data: "data/dota-test.yaml"
  cfg: "models/yolov5s.yaml"
  weights: ""
  epochs: 300
  batchsize: 2
  imagesize: 1024
  device: "0"
  workers: 0
  hyp: "data/hyps/obb/hyp.finetune_dota.yaml"

degradation:
  enabled: true
  psf:
    enabled: true
    kernelsize: 5
    sigma: 1.0
  downsample:
    enabled: true
    scale: 2.0
  noise:
    enabled: true
    type: "gaussian"
    level: 0.01
  upsamplemode: "bilinear"
  seed: 42

clearbranch:
  enabled: true
  strategy: "evalmode"
  extractsparse: true
  topk: 300
  confidencethreshold: 0.10

distillation:
  enabled: true
  alpha: 0.1
  topk: 300
  confidencethreshold: 0.10
  iouthreshold: 0.1
  distancethreshold: 2.0
  classtemperature: 2.0
  angletemperature: 2.0
  shortedgethreshold: 8.0

profiling:
  enabled: false
  loginterval: 100
  savestats: true
  outputdir: "runs/profiling"

ablationmode: "full"
