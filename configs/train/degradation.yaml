experiment:
  name: msdylodegradation
  description: MSDYOLO with sensor degradation
  phase: 1
training:
  data: msdyolo/data/dior.yaml
  cfg: configs/models/yolov5s.yaml
  weights: yolov5s.pt
  epochs: 200
  batchsize: 16
  imagesize: 1024
  device: '0'
  workers: 4
  hyp: msdyolo/data/hyps/obb/hyp.finetune_dota.yaml
degradation:
  enabled: true
  psf:
    enabled: true
    kernelsize: 5
    sigma: 1.0
  downsample:
    enabled: true
    scale: 2.0
  noise:
    enabled: true
    type: gaussian
    level: 0.01
  upsamplemode: bilinear
  seed: 42
clearbranch:
  enabled: false
distillation:
  enabled: false
profiling:
  enabled: false
ablationmode: withdegradation
